<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sessionary Design Playground</title>
<style>
/*FONTS*/

/* =========================================================================================
   Shared foundation — identical across directions
   spacing: 4/8 scale · five type sizes per direction (--f1…--f5) · one accent per direction
   ========================================================================================= */
:root {
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
  --rail: 56px;
  --sans: 'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei UI', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'Noto Sans Mono CJK SC', Menlo, Consolas, monospace;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --t1: 120ms; --t2: 200ms; --t3: 260ms;
  --pg-h: 40px;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font-family: var(--sans); background: #0b0b0c; overflow: hidden; -webkit-font-smoothing: antialiased; font-feature-settings: 'cv11', 'calt'; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; text-align: left; cursor: default; }
input, textarea { font: inherit; color: inherit; }
.i { flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.i.s14 { stroke-width: 1.85; } .i.s12 { stroke-width: 2; }
kbd { font: 500 11px/1 var(--sans); color: var(--text-3); min-width: 18px; height: 18px; padding: 0 5px; display: inline-flex; align-items: center; justify-content: center; border-radius: 4px; background: var(--fill); font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 0.9em; letter-spacing: -0.01em; }
.grow { flex: 1; min-width: 0; }
.ellip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
::selection { background: var(--accent-fill); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 10px; border: 3px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }

/* ---------------- playground chrome (not part of the design) ---------------- */
.pg { position: fixed; inset: 0 0 auto 0; height: var(--pg-h); display: flex; align-items: center; gap: 8px; padding: 0 12px; background: #0b0b0c; color: #c9c9cc; font-size: 12px; border-bottom: 1px solid #222; z-index: 100; }
.pg b { color: #fff; font-weight: 600; margin-right: 6px; letter-spacing: -0.01em; }
.pg .grp { display: inline-flex; background: #19191b; border-radius: 7px; padding: 2px; gap: 2px; }
.pg .grp button, .pg > button { height: 26px; padding: 0 10px; border-radius: 5px; color: #a7a7ad; white-space: nowrap; }
.pg .grp button:hover, .pg > button:hover { color: #fff; background: #232326; }
.pg .grp button.on { background: #2c2c30; color: #fff; }
.pg .sep { width: 1px; height: 18px; background: #2a2a2d; margin: 0 4px; }
.pg-note { position: fixed; top: calc(var(--pg-h) + 8px); right: 12px; width: 380px; max-height: calc(100vh - 80px); overflow: auto; background: #141416; color: #cfcfd3; border: 1px solid #2a2a2e; border-radius: 10px; padding: 16px 18px; font-size: 13px; line-height: 1.6; z-index: 101; box-shadow: 0 16px 48px rgb(0 0 0 / .5); }
.pg-note h3 { margin: 0 0 4px; color: #fff; font-size: 15px; font-weight: 600; }
.pg-note h4 { margin: 14px 0 4px; color: #fff; font-size: 12px; font-weight: 600; }
.pg-note p { margin: 0 0 6px; } .pg-note ul { margin: 0; padding-left: 18px; }
.pg-note code { font-family: var(--mono); font-size: 12px; color: #fff; }
body.no-chrome { --pg-h: 0px; } body.no-chrome .pg, body.no-chrome .pg-note { display: none; }

/* =========================================================================================
   Direction tokens
   ========================================================================================= */
/* A · Native — Things 3 / macOS. Warm paper, soft surfaces, generous rhythm, one calm blue. */
[data-dir="a"] { --f1: 12px; --f2: 13px; --f3: 14px; --f4: 15px; --f5: 24px; --lh-prose: 1.68; --r1: 6px; --r2: 8px; --r3: 10px; --row-h: 50px; --measure: 700px; }
[data-dir="a"][data-theme="light"] {
  --bg-app: #f2f1ee; --bg-side: #f2f1ee; --bg-main: #fcfcfb; --bg-insp: #fcfcfb; --bg-pop: #ffffff; --bg-input: #ffffff; --bg-code: #f4f3f0;
  --fill: rgb(48 40 28 / .05); --hover: rgb(48 40 28 / .05); --sel: rgb(48 40 28 / .085); --line: rgb(48 40 28 / .085); --line-2: rgb(48 40 28 / .14);
  --text: #1c1b19; --text-2: #5b5954; --text-3: #8d8a83; --accent: #2f6ae0; --accent-fill: rgb(47 106 224 / .12); --on-accent: #fff;
  --add: #2c8550; --del: #c4473d; --add-bg: rgb(44 133 80 / .09); --del-bg: rgb(196 71 61 / .08); --warn: #b07418;
  --shadow-pop: 0 0 0 1px rgb(48 40 28 / .08), 0 10px 32px rgb(48 40 28 / .16); --user-bg: rgb(48 40 28 / .045); color-scheme: light;
}
[data-dir="a"][data-theme="dark"] {
  --bg-app: #1a1918; --bg-side: #1a1918; --bg-main: #211f1e; --bg-insp: #211f1e; --bg-pop: #2a2826; --bg-input: #262422; --bg-code: #1b1a19;
  --fill: rgb(255 248 236 / .055); --hover: rgb(255 248 236 / .05); --sel: rgb(255 248 236 / .09); --line: rgb(255 248 236 / .075); --line-2: rgb(255 248 236 / .13);
  --text: #edebe7; --text-2: #a7a39c; --text-3: #7b7871; --accent: #5e92f2; --accent-fill: rgb(94 146 242 / .16); --on-accent: #fff;
  --add: #6cc38d; --del: #ee7f74; --add-bg: rgb(108 195 141 / .12); --del-bg: rgb(238 127 116 / .12); --warn: #e0ac55;
  --shadow-pop: 0 0 0 1px rgb(0 0 0 / .55), 0 0 0 1px rgb(255 255 255 / .06) inset, 0 14px 40px rgb(0 0 0 / .5); --user-bg: rgb(255 248 236 / .05); color-scheme: dark;
}
/* B · Linear — cool graphite, dense single-line lists, properties panel, activity timeline, indigo. */
[data-dir="b"] { --f1: 12px; --f2: 13px; --f3: 14px; --f4: 14px; --f5: 20px; --lh-prose: 1.62; --r1: 5px; --r2: 6px; --r3: 8px; --row-h: 32px; --measure: 760px; }
[data-dir="b"][data-theme="dark"] {
  --bg-app: #0e0f11; --bg-side: #0e0f11; --bg-main: #141518; --bg-insp: #141518; --bg-pop: #1c1d21; --bg-input: #18191c; --bg-code: #101113;
  --fill: rgb(255 255 255 / .045); --hover: rgb(255 255 255 / .045); --sel: rgb(255 255 255 / .075); --line: rgb(255 255 255 / .065); --line-2: rgb(255 255 255 / .11);
  --text: #e4e5e9; --text-2: #9b9ca4; --text-3: #6b6d75; --accent: #7d7af4; --accent-fill: rgb(125 122 244 / .18); --on-accent: #fff;
  --add: #4cc38a; --del: #f0716a; --add-bg: rgb(76 195 138 / .1); --del-bg: rgb(240 113 106 / .1); --warn: #e4b34c;
  --shadow-pop: 0 0 0 1px rgb(255 255 255 / .08), 0 16px 40px rgb(0 0 0 / .55); --user-bg: transparent; color-scheme: dark;
}
[data-dir="b"][data-theme="light"] {
  --bg-app: #f3f3f5; --bg-side: #f3f3f5; --bg-main: #ffffff; --bg-insp: #ffffff; --bg-pop: #ffffff; --bg-input: #ffffff; --bg-code: #f6f6f8;
  --fill: rgb(20 20 40 / .045); --hover: rgb(20 20 40 / .045); --sel: rgb(20 20 40 / .075); --line: rgb(20 20 40 / .08); --line-2: rgb(20 20 40 / .13);
  --text: #17171c; --text-2: #5c5d66; --text-3: #8a8b94; --accent: #5652d8; --accent-fill: rgb(86 82 216 / .12); --on-accent: #fff;
  --add: #1f8a57; --del: #cf3f37; --add-bg: rgb(31 138 87 / .08); --del-bg: rgb(207 63 55 / .07); --warn: #a8700f;
  --shadow-pop: 0 0 0 1px rgb(20 20 40 / .09), 0 12px 36px rgb(20 20 40 / .14); --user-bg: transparent; color-scheme: light;
}
/* C · Raycast — keyboard-first, search is the spine, action bars with key hints, charcoal + signal coral. */
[data-dir="c"] { --f1: 12px; --f2: 13px; --f3: 14px; --f4: 15px; --f5: 22px; --lh-prose: 1.65; --r1: 6px; --r2: 8px; --r3: 10px; --row-h: 40px; --measure: 720px; }
[data-dir="c"][data-theme="dark"] {
  --bg-app: #171717; --bg-side: #1c1c1c; --bg-main: #171717; --bg-insp: #1b1b1b; --bg-pop: #222222; --bg-input: transparent; --bg-code: #121212;
  --fill: rgb(255 255 255 / .055); --hover: rgb(255 255 255 / .055); --sel: rgb(255 255 255 / .095); --line: rgb(255 255 255 / .07); --line-2: rgb(255 255 255 / .12);
  --text: #f3f3f3; --text-2: #a4a4a4; --text-3: #717171; --accent: #ff6a58; --accent-fill: rgb(255 106 88 / .15); --on-accent: #1d0703;
  --add: #59d185; --del: #ff7a6b; --add-bg: rgb(89 209 133 / .1); --del-bg: rgb(255 122 107 / .1); --warn: #f2b84b;
  --shadow-pop: 0 0 0 1px rgb(255 255 255 / .09), 0 24px 60px rgb(0 0 0 / .6); --user-bg: transparent; color-scheme: dark;
}
[data-dir="c"][data-theme="light"] {
  --bg-app: #fafafa; --bg-side: #f2f2f2; --bg-main: #fafafa; --bg-insp: #f5f5f5; --bg-pop: #ffffff; --bg-input: transparent; --bg-code: #f0f0f0;
  --fill: rgb(0 0 0 / .045); --hover: rgb(0 0 0 / .045); --sel: rgb(0 0 0 / .075); --line: rgb(0 0 0 / .075); --line-2: rgb(0 0 0 / .13);
  --text: #151515; --text-2: #575757; --text-3: #8b8b8b; --accent: #df4f3b; --accent-fill: rgb(223 79 59 / .12); --on-accent: #fff;
  --add: #1f8b4c; --del: #cf3f30; --add-bg: rgb(31 139 76 / .08); --del-bg: rgb(207 63 48 / .07); --warn: #a26d0c;
  --shadow-pop: 0 0 0 1px rgb(0 0 0 / .08), 0 20px 50px rgb(0 0 0 / .18); --user-bg: transparent; color-scheme: light;
}

/* =========================================================================================
   App shell: sidebar | split | document | split | inspector
   ========================================================================================= */
.app { position: fixed; inset: var(--pg-h) 0 0 0; display: grid; grid-template-columns: var(--side-cur) 0 minmax(440px, 1fr) 0 var(--insp-cur); background: var(--bg-app); color: var(--text); font-size: var(--f2); line-height: 1.45; letter-spacing: -0.003em; transition: grid-template-columns var(--t3) var(--ease); }
.app { --side-cur: var(--side-w); --insp-cur: var(--insp-w); }
.app[data-side="collapsed"] { --side-cur: var(--rail); }
.app[data-insp="closed"] { --insp-cur: 0px; }
html.resizing .app { transition: none; }
html.resizing, html.resizing * { cursor: col-resize !important; user-select: none !important; }

/* split handles: zero-width track, 9px hit area, quiet line that wakes on hover */
.split { position: relative; z-index: 5; }
.split::before { content: ''; position: absolute; top: 0; bottom: 0; left: -4px; width: 9px; cursor: col-resize; }
.split::after { content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 1px; background: var(--split-line, var(--line)); transition: background var(--t2), width var(--t1), left var(--t1); }
.split:hover::after { transition-delay: 150ms; }
.split:hover::after, .split.active::after { background: var(--accent); opacity: .55; width: 2px; left: -0.5px; }
.app[data-insp="closed"] .split[data-split="insp"]::after { background: transparent; }

/* ---------------- sidebar ---------------- */
.side { position: relative; background: var(--bg-side); overflow: hidden; min-width: 0; }
.side-full { position: absolute; inset: 0 auto 0 0; width: var(--side-w); display: flex; flex-direction: column; transition: opacity var(--t2) var(--ease), transform var(--t3) var(--ease); }
.side-rail { position: absolute; inset: 0 auto 0 0; width: var(--rail); display: flex; flex-direction: column; align-items: center; gap: var(--s1); padding: var(--s3) 0; opacity: 0; pointer-events: none; transition: opacity var(--t2) var(--ease); }
.app[data-side="collapsed"] .side-full { opacity: 0; pointer-events: none; transform: translateX(-12px); }
.app[data-side="collapsed"] .side-rail { opacity: 1; pointer-events: auto; transition-delay: 80ms; }
.rail-btn { position: relative; width: 36px; height: 36px; border-radius: var(--r2); display: grid; place-items: center; color: var(--text-2); transition: background var(--t1), color var(--t1); }
.rail-btn:hover { background: var(--hover); color: var(--text); }
.rail-btn.on { background: var(--sel); color: var(--text); }
.rail-btn.on::before { content: ''; position: absolute; left: -10px; top: 9px; bottom: 9px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
.rail-sep { width: 20px; height: 1px; background: var(--line); margin: var(--s1) 0; }
.rail-count { position: absolute; right: 2px; bottom: 2px; font-size: 9px; line-height: 1; color: var(--text-3); font-variant-numeric: tabular-nums; }

.ibtn { width: 28px; height: 28px; flex: none; border-radius: var(--r1); display: inline-grid; place-items: center; color: var(--text-3); transition: background var(--t1), color var(--t1); }
.ibtn:hover { background: var(--hover); color: var(--text); }
.ibtn.on { color: var(--text); background: var(--sel); }

.list { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }
.group-h { display: flex; align-items: center; gap: var(--s2); padding: var(--s4) var(--s4) var(--s1); font-size: var(--f1); font-weight: 600; color: var(--text-3); }
.group-h .num { font-weight: 500; opacity: .8; }
.row { position: relative; display: flex; flex-direction: column; justify-content: center; width: calc(100% - var(--s2) * 2); margin: 0 var(--s2); padding: 0 var(--s2); border-radius: var(--r1); min-height: var(--row-h); transition: background var(--t1); }
.row:hover { background: var(--hover); }
.row.on { background: var(--sel); }
.row-t { font-size: var(--f2); color: var(--text); font-weight: 450; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-m { font-size: var(--f1); color: var(--text-3); display: flex; gap: var(--s2); min-width: 0; }
.row-time { font-size: var(--f1); color: var(--text-3); font-variant-numeric: tabular-nums; flex: none; }
.agent-g { flex: none; display: inline-block; vertical-align: middle; }

/* ---------------- document ---------------- */
.doc { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg-main); }
.toolbar { flex: none; display: flex; align-items: center; gap: var(--s1); height: 48px; padding: 0 var(--s3) 0 var(--s4); position: relative; z-index: 3; }
.tb-title { min-width: 0; font-size: var(--f3); font-weight: 600; letter-spacing: -0.01em; opacity: 0; transform: translateY(4px); transition: opacity var(--t2), transform var(--t2) var(--ease); }
.doc.scrolled .tb-title { opacity: 1; transform: none; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scroll-padding: 80px; }
.thread { max-width: calc(var(--measure) + var(--s6) * 2); margin: 0 auto; padding: var(--s2) var(--s6) var(--s7); }

.seg { display: inline-flex; padding: 2px; border-radius: var(--r2); background: var(--fill); }
.seg button { height: 26px; padding: 0 var(--s3); border-radius: var(--r1); font-size: var(--f2); color: var(--text-2); display: inline-flex; align-items: center; gap: 6px; transition: color var(--t1), background var(--t1); }
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--bg-main); color: var(--text); box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgb(0 0 0 / .08); }
.seg .cnt { color: var(--text-3); font-size: var(--f1); }

.tabs { display: flex; gap: var(--s5); border-bottom: 1px solid var(--line); }
.tabs button { position: relative; height: 40px; font-size: var(--f2); color: var(--text-2); font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.tabs button:hover { color: var(--text); }
.tabs button.on { color: var(--text); }
.tabs button.on::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; border-radius: 2px; background: var(--accent); }
.tabs .cnt { font-size: var(--f1); color: var(--text-3); font-variant-numeric: tabular-nums; }

/* messages */
.msg { margin-top: var(--s5); }
.msg.user + .msg { margin-top: var(--s4); }
.who { display: flex; align-items: center; gap: var(--s2); font-size: var(--f2); font-weight: 600; color: var(--text); margin-bottom: var(--s2); }
.who time { font-weight: 400; color: var(--text-3); font-size: var(--f1); font-variant-numeric: tabular-nums; }
.prose { font-size: var(--f4); line-height: var(--lh-prose); color: var(--text); }
.prose p { margin: 0 0 var(--s3); } .prose p:last-child { margin-bottom: 0; }
.prose ol, .prose ul { margin: 0 0 var(--s3); padding-left: 22px; } .prose li { margin: 2px 0; } .prose li::marker { color: var(--text-3); }
.prose code { font-family: var(--mono); font-size: .86em; padding: 1px 5px; border-radius: 4px; background: var(--fill); }
.prose strong { font-weight: 600; }
pre.code { margin: var(--s3) 0; padding: var(--s3) var(--s4); border-radius: var(--r2); background: var(--bg-code); font: 12.5px/1.6 var(--mono); color: var(--text); overflow-x: auto; box-shadow: 0 0 0 1px var(--line) inset; }
pre.code .c { color: var(--text-3); } pre.code .k { color: var(--accent); }

/* tool steps */
.steps { margin-top: var(--s3); position: relative; }
.step { display: block; }
.step-row { display: flex; align-items: center; gap: var(--s2); width: 100%; height: 30px; padding: 0 var(--s2); margin-left: calc(var(--s2) * -1); border-radius: var(--r1); color: var(--text-2); font-size: var(--f2); transition: background var(--t1); }
.step-row:hover { background: var(--hover); }
.step-row .i { color: var(--text-3); }
.step-row .verb { font-weight: 500; color: var(--text-2); flex: none; }
.step-row .tgt { font-family: var(--mono); font-size: 12px; color: var(--text-3); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.step-row .tgt.prose-t { font-family: var(--sans); font-size: var(--f2); }
.step-row .chev { color: var(--text-3); transition: transform var(--t2) var(--ease); opacity: 0; }
.step-row:hover .chev, .step.open > .step-row .chev { opacity: 1; }
.step.open > .step-row .chev { transform: rotate(90deg); }
.stat { font: 500 12px/1 var(--mono); display: inline-flex; gap: 6px; flex: none; }
.stat .a { color: var(--add); } .stat .d { color: var(--del); }
.flag { font-size: var(--f1); color: var(--del); flex: none; }
.step-body { padding: var(--s1) 0 var(--s3) 26px; }
.out { margin: 0; padding: var(--s2) var(--s3); border-radius: var(--r1); background: var(--bg-code); font: 12px/1.6 var(--mono); color: var(--text-2); white-space: pre-wrap; box-shadow: 0 0 0 1px var(--line) inset; }
.diff { border-radius: var(--r1); overflow-x: auto; font: 12px/1.65 var(--mono); box-shadow: 0 0 0 1px var(--line) inset; background: var(--bg-code); }
.diff .l { display: grid; grid-template-columns: 34px 34px 16px 1fr; white-space: pre; min-width: max-content; }
.diff .n { color: var(--text-3); text-align: right; padding-right: 6px; opacity: .7; user-select: none; }
.diff .s { color: var(--text-3); text-align: center; }
.diff .add { background: var(--add-bg); } .diff .add .s { color: var(--add); }
.diff .del { background: var(--del-bg); } .diff .del .s { color: var(--del); }
.diff .hunk { color: var(--text-3); background: var(--fill); padding-left: 12px; display: block; }
.step-children { padding-left: 0; }

/* composer */
.composer { flex: none; padding: 0 var(--s6) var(--s4); }
.composer-in { max-width: var(--measure); margin: 0 auto; }
.cbox { background: var(--bg-input); border-radius: var(--r3); box-shadow: 0 0 0 1px var(--line-2), 0 2px 8px rgb(0 0 0 / .04); padding: var(--s3) var(--s3) var(--s2) var(--s4); transition: box-shadow var(--t2); }
.cbox:focus-within { box-shadow: 0 0 0 1px var(--accent), 0 0 0 4px var(--accent-fill); }
.cbox textarea { display: block; width: 100%; resize: none; border: 0; outline: 0; background: none; font-size: var(--f3); line-height: 1.5; color: var(--text); padding: 2px 0; height: 24px; }
.cbox textarea::placeholder { color: var(--text-3); }
.cbar { display: flex; align-items: center; gap: var(--s2); margin-top: var(--s2); }
.mode { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 var(--s2); margin-left: calc(var(--s2) * -1); border-radius: var(--r1); font-size: var(--f1); color: var(--text-2); }
.mode:hover { background: var(--hover); color: var(--text); }
.mode.write { color: var(--warn); }
.hint { font-size: var(--f1); color: var(--text-3); }
.send { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); }
.send:disabled { background: var(--fill); color: var(--text-3); }

/* outline (prompt index) */
.outline { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 8px; padding: 6px; z-index: 2; }
.outline button { width: 14px; height: 2px; border-radius: 2px; background: var(--line-2); transition: background var(--t1), width var(--t1); }
.outline button.on { background: var(--text-2); width: 18px; margin-left: -4px; }

/* ======================================================================================
   Conversation
   ====================================================================================== */
function stepRow(it, key, i) {
  const [icon, verb] = KIND[it.kind]
  const open = state.open.has(key + ':' + i) || it.open && !state.open.has('!' + key + ':' + i)
  const hasBody = it.diff || it.out || it.kind === 'think' || it.kind === 'edit' || it.kind === 'write' || it.kind === 'shell'
  const meta = `${it.add != null ? `<span class="stat"><span class="a">+${it.add}</span><span class="d">−${it.del}</span></span>` : ''}${it.fail ? '<span class="flag">failed</span>' : ''}`
  let body = ''
  if (open) {
    if (it.diff) body = `<div class="diff">${it.diff.map((l) => l[0] === 'h' ? `<span class="hunk">${esc(l[1])}</span>` : `<div class="l ${l[0] === '+' ? 'add' : l[0] === '-' ? 'del' : ''}"><span class="n">${l[1] ?? ''}</span><span class="n">${l[2] ?? ''}</span><span class="s">${l[0] === ' ' ? '' : l[0] === '-' ? '−' : '+'}</span><span>${esc(l[3])}</span></div>`).join('')}</div>`
    else if (it.kind === 'think') body = `<div class="prose" style="font-size:var(--f2);color:var(--text-2)">${esc(it.text)}</div>`
    else if (it.out) body = `<pre class="out">${esc(it.out)}</pre>`
    else if (it.fail) body = `<pre class="out">Failed to get session: No session '' known</pre>`
    else body = `<pre class="out">${it.kind === 'write' ? '[Unit]\nDescription=Lock the session before sleep\nBefore=sleep.target\n…' : '(no output)'}</pre>`
  }
  const tgt = it.kind === 'think' ? (open ? '' : `<span class="tgt prose-t">${esc(it.text)}</span>`) : `<span class="tgt">${esc(it.target)}</span>`
  return `<div class="step ${open ? 'open' : ''}"><button class="step-row" data-toggle="${key}:${i}" data-def="${it.open ? 1 : 0}">
    ${state.dir === 'b' ? '<span class="ndot"></span>' : ''}${ic(icon, 14)}<span class="verb">${verb}</span>${tgt}<span class="grow"></span>${meta}${state.dir === 'c' ? `<kbd class="kh">↵</kbd>` : ''}${hasBody ? ic('chevron-right', 14, 'chev') : ''}</button>
    ${open ? `<div class="step-body">${body}</div>` : ''}</div>`
}
function steps(item, idx) {
  const key = 's' + idx
  const n = item.items.length
  if (n < 3) return `<div class="steps">${item.items.map((it, i) => stepRow(it, key, i)).join('')}</div>`
  const open = state.open.has(key)
  const counts = {}
  for (const it of item.items) if (it.kind !== 'think') counts[KIND[it.kind][1]] = (counts[KIND[it.kind][1]] || 0) + 1
  const summary = Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${k} ${v}`).join(' · ')
  const fails = item.items.filter((x) => x.fail).length
  return `<div class="steps"><div class="step ${open ? 'open' : ''}"><button class="step-row" data-toggle="${key}">${state.dir === 'b' ? '<span class="ndot"></span>' : ''}${ic('layers', 14)}<span class="verb">${n} steps</span><span class="tgt prose-t">${summary}</span><span class="grow"></span>${fails ? `<span class="flag">${fails} failed</span>` : ''}${ic('chevron-right', 14, 'chev')}</button>
    ${open ? `<div class="step-children">${item.items.map((it, i) => stepRow(it, key, i)).join('')}</div>` : ''}</div></div>`
}
function message(m, idx) {
  const d = state.dir
  if (m.k === 'steps') return steps(m, idx)
  const user = m.k === 'user'
  const a = agentOf(SESSION.agent)
  if (d === 'a') {
    if (user) return `<section class="msg user" data-prompt><div class="who">You <time>${m.time}</time></div><div class="ubox prose">${m.html}</div></section>`
    return `<section class="msg">${m.head ? `<div class="who">${glyph(a.id, 14)}${a.label} <time>${m.time}</time></div>` : ''}<div class="prose">${m.html}</div></section>`
  }
  if (d === 'b') {
    if (user) return `<section class="msg user" data-prompt><span class="av">Y</span><div class="who">you <time>${m.time}</time></div><div class="ubox">${m.html}</div></section>`
    return `<section class="msg">${m.head ? `<span class="av">${glyph(a.id, 13)}</span><div class="who">${a.label} <time>${m.time} · ${SESSION.model}</time></div>` : ''}<div class="prose">${m.html}</div></section>`
  }
  if (user) return `<section class="msg user" data-prompt><span class="mark">${ic('chevron-right', 16)}</span><div class="uwho"><span>You</span><span>${m.time}</span></div><div class="ubox prose">${m.html}</div></section>`
  return `<section class="msg">${m.head ? `<span class="mark">${glyph(a.id, 14)}</span>` : ''}<div class="prose">${m.html}</div></section>`
}
function conversation() {
  const s = SESSION, a = agentOf(s.agent), d = state.dir
  let head = ''
  if (d === 'a') head = `<header class="doc-head"><h1>${esc(s.title)}</h1><div class="doc-meta">${glyph(a.id, 14)}<span>${a.label}</span><span class="sep">·</span><span>${ic('git-branch', 14)} <span class="mono">${s.branch}</span></span><span class="sep">·</span><span>${s.messages} messages</span><span class="sep">·</span><span>${s.date}</span></div></header>`
  if (d === 'b') head = `<header class="doc-head"><h1>${esc(s.title)}</h1><div class="doc-sub">${a.label} · ${s.model} · ${s.messages} messages · started ${s.started}</div></header>`
  const body = CONV.map(message).join('')
  return `<div class="thread">${head}${d === 'b' ? `<div class="tl">${body}</div>` : `<div style="margin-top:${d === 'a' ? '8px' : 0}">${body}</div>`}</div>`
}
function changesView() {
  const f = CHANGES[state.changeSel]
  const diff = state.changeSel === 0 ? DIFF1 : [['h', '@@ -0,0 +1,14 @@'], ...['[Unit]', 'Description=Lock the session before sleep', 'Before=sleep.target', '', '[Service]', 'Type=oneshot', 'ExecStart=/usr/bin/loginctl lock-session', 'ExecStartPost=/usr/bin/sleep 1'].map((t, i) => ['+', null, i + 1, t])]
  return `<div class="changes"><div class="ch-files">${CHANGES.map((c, i) => `<button class="fline ${i === state.changeSel ? 'on' : ''}" data-change="${i}"><span class="gst ${c.st}">${c.st}</span><span class="ellip">${c.path.split('/').pop()}</span><span class="dir grow">${dirOf(c.path)}</span><span class="stat"><span class="a">+${c.add}</span><span class="d">−${c.del}</span></span></button>`).join('')}</div>
    <div class="ch-diff"><h3>${ic('file-pen', 16)}<span class="mono">${f.path}</span><span class="stat"><span class="a">+${f.add}</span><span class="d">−${f.del}</span></span></h3><div class="diff">${diff.map((l) => l[0] === 'h' ? `<span class="hunk">${esc(l[1])}</span>` : `<div class="l ${l[0] === '+' ? 'add' : l[0] === '-' ? 'del' : ''}"><span class="n">${l[1] ?? ''}</span><span class="n">${l[2] ?? ''}</span><span class="s">${l[0] === ' ' ? '' : l[0] === '-' ? '−' : '+'}</span><span>${esc(l[3])}</span></div>`).join('')}</div></div></div>`

function composer() {

      <button class="mi">${ic('refresh-cw', 16)}<span class="grow">Rescan sources</span></button>
      <div class="msep"></div><div class="mlabel">Appearance</div>
      ${[['sun', 'Light', 'light'], ['moon', 'Dark', 'dark'], ['monitor', 'System', 'sys']].map(([i, l, v]) => `<button class="mi" data-theme="${v}">${ic(i, 16)}<span class="grow">${l}</span>${state.theme === v ? ic('check', 14, 'check') : ''}</button>`).join('')}
      <div class="msep"></div><button class="mi">${ic('keyboard', 16)}<span class="grow">Keyboard shortcuts</span><kbd>?</kbd></button>
      <div class="msep"></div><div class="mfoot"><span class="dot-ok"></span>71 sessions indexed · 2m ago</div></div>`
  }
  if (m === 'more') {
    const p = anchor('[data-act="more-menu"]')
    h += `<div class="pop" style="left:${p.x - 220}px;top:${p.y}px;width:248px">
      <button class="mi">${ic('copy', 16)}<span class="grow">Copy session ID</span></button>
      <button class="mi">${ic('external-link', 16)}<span class="grow">Open folder</span></button>
      <div class="msep"></div><button class="mi">${ic('trash-2', 16)}<span class="grow">Move to Trash</span><kbd>Del</kbd></button>
      <button class="mi" style="color:var(--del)">${ic('trash-2', 16)}<span class="grow">Delete from disk…</span></button></div>`
  }
  if (m) h = `<div class="mscrim" data-act="close" style="position:fixed;inset:0;z-index:55"></div>` + h
  if (state.palette) h += palette()
  return h
}
function palette() {
  const q = state.pq.toLowerCase()
  const all = AGENTS.flatMap((a) => SESSIONS[a.id].map((s) => ({ ...s, a: a.id })))
  const ses = (q ? all.filter((s) => (s.t + s.p).toLowerCase().includes(q)) : all.slice(0, 4)).slice(0, 5)
  const hl = (t) => (q ? esc(t).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'ig'), (m) => `<mark>${m}</mark>`) : esc(t))
  const cmds = [['panel-left', 'Toggle sidebar', '['], ['panel-right', 'Toggle project context', ']'], ['trash-2', 'Open Trash', ''], ['sun-moon', 'Change theme…', ''], ['keyboard', 'Keyboard shortcuts', '?'], ['refresh-cw', 'Rescan sources', '']].filter(([, l]) => !q || l.toLowerCase().includes(q))
  return `<div class="scrim" data-act="close-pal"></div><div class="pal" role="dialog">
    <div class="pal-in">${ic('search', 20)}<input id="pq" placeholder="Search sessions, messages and commands" value="${esc(state.pq)}" autocomplete="off"><kbd>Esc</kbd></div>
    <div class="pal-list">
      ${ses.length ? `<div class="mlabel">${q ? 'Sessions' : 'Recent'}</div>` + ses.map((s, i) => `<button class="mi ${i === 0 ? 'kb' : ''}" data-sel="${s.id}" data-agent-of="${s.a}">${glyph(s.a, 16)}<span class="grow ellip">${hl(s.t)}</span><span class="meta">${esc(s.p || '')}</span><span class="meta" style="width:44px;text-align:right">${s.rel}</span></button>`).join('') : ''}
      ${q || true ? `<div class="mlabel">Messages</div>
        <button class="mi tall">${glyph('claude-code', 16)}<span class="grow"><span style="display:flex;gap:8px"><span class="ellip">Niri + DMS super+l 锁屏与挂起</span><span class="meta">3 hits</span></span><span class="snip">…合盖的顺序是：<mark>锁屏</mark> → 等待 DMS 报告 locked → 挂起…</span></span></button>
        <button class="mi tall">${glyph('pi', 16)}<span class="grow"><span style="display:flex;gap:8px"><span class="ellip">i3wm 触摸板轻触点击与双指右键</span><span class="meta">1 hit</span></span><span class="snip">…xss-lock 会在 <mark>锁屏</mark> 之前…</span></span></button>` : ''}
      ${cmds.length ? `<div class="mlabel">Commands</div>` + cmds.map(([i, l, k]) => `<button class="mi">${ic(i, 16)}<span class="grow">${l}</span>${k ? `<kbd>${k}</kbd>` : ''}</button>`).join('') : ''}
    </div>
    <div class="pal-foot"><span><kbd>↑</kbd><kbd>↓</kbd> Navigate</span><span><kbd>↵</kbd> Open</span><span><kbd>Tab</kbd> Messages only</span><span class="grow"></span><span>Search runs over all agents</span></div></div>`
}

/* ======================================================================================
   Playground chrome
   ====================================================================================== */
function chrome() {
  const b = (on, attr, label) => `<button class="${on ? 'on' : ''}" ${attr}>${label}</button>`
  return `<b>Sessionary · design playground</b>
    <div class="grp">${Object.entries(DIRS).map(([k, v]) => b(state.dir === k, `data-pg-dir="${k}"`, v.name)).join('')}</div>
    <div class="grp">${b(state.theme === 'light', 'data-pg-theme="light"', 'Light')}${b(state.theme === 'dark', 'data-pg-theme="dark"', 'Dark')}</div>
    <span class="sep"></span>
    <div class="grp">${b(state.side === 'expanded', 'data-pg-side="expanded"', 'Sidebar expanded')}${b(state.side === 'collapsed', 'data-pg-side="collapsed"', 'Collapsed')}</div>
    <button data-act="palette">${kbdMod} K palette</button><button data-act="find">${kbdMod} F find</button><button data-pg-reset>Reset sizes</button>
    <span class="grow"></span><button data-pg-note class="${state.note ? 'on' : ''}">About ${DIRS[state.dir].name.split(' · ')[1]}</button>`
}

/* ======================================================================================
   Render
   ====================================================================================== */
const app = document.getElementById('app')
function applyVars() {
  app.style.setProperty('--side-w', state.sideW + 'px')
  app.style.setProperty('--insp-w', state.inspW + 'px')
}
function render() {
  const keep = { list: document.getElementById('list')?.scrollTop, scroll: document.getElementById('scroll')?.scrollTop }
  const theme = state.theme === 'sys' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : state.theme
  app.dataset.dir = state.dir; app.dataset.theme = theme; app.dataset.side = state.side; app.dataset.insp = state.insp
  document.getElementById('layer').dataset.dir = state.dir; document.getElementById('layer').dataset.theme = theme
  applyVars()
  app.innerHTML = `<aside class="side">${sidebar()}</aside><div class="split" data-split="side" role="separator" aria-orientation="vertical" title="Drag to resize · double-click to reset"></div>
    <main class="doc" id="doc">${documentPane()}</main><div class="split" data-split="insp" role="separator" aria-orientation="vertical" title="Drag to resize · double-click to reset"></div>
    <aside class="insp"><div class="insp-in">${inspector()}</div></aside>`
  document.getElementById('pg').innerHTML = chrome()
  document.querySelector('.pg-note')?.remove()
  if (state.note) document.body.insertAdjacentHTML('beforeend', `<div class="pg-note">${DIRS[state.dir].note}</div>`)
  if (keep.list != null && document.getElementById('list')) document.getElementById('list').scrollTop = keep.list
  if (keep.scroll != null && document.getElementById('scroll')) document.getElementById('scroll').scrollTop = keep.scroll
  renderLayer()
  wire()
  if (state.find) paintFind()
}
function renderLayer() {
  const L = document.getElementById('layer')
  L.innerHTML = layer()
  const pq = document.getElementById('pq')
  if (pq) { pq.focus(); pq.setSelectionRange(pq.value.length, pq.value.length); pq.oninput = () => { state.pq = pq.value; renderLayer() } }
}
function paintFind() {
  const root = document.getElementById('scroll'); if (!root) return
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); const nodes = []
  for (let n = w.nextNode(); n; n = w.nextNode()) if (n.nodeValue.includes('锁屏')) nodes.push(n)
  let k = 0
  for (const n of nodes) { const parts = n.nodeValue.split('锁屏'); const frag = document.createDocumentFragment(); parts.forEach((p, i) => { frag.append(p); if (i < parts.length - 1) { const m = document.createElement('mark'); m.className = 'f' + (k++ === 1 ? ' cur' : ''); m.textContent = '锁屏'; frag.append(m) } }); n.replaceWith(frag) }
}
function wire() {
  const sc = document.getElementById('scroll')
  if (sc) sc.onscroll = () => {
    document.getElementById('doc').classList.toggle('scrolled', sc.scrollTop > 64)
    const ps = [...sc.querySelectorAll('[data-prompt]')]; let act = 0
    ps.forEach((p, i) => { if (p.offsetTop - sc.scrollTop < 120) act = i })
    document.querySelectorAll('.outline button').forEach((b, i) => b.classList.toggle('on', i === act))
  }
  const f = document.getElementById('filter')
  if (f) f.oninput = () => { state.filter = f.value; const l = document.getElementById('list'); const tmp = document.createElement('div'); tmp.innerHTML = sidebar(); l.innerHTML = tmp.querySelector('#list').innerHTML; document.querySelector('.scope-bar .num').textContent = visibleSessions().length }
  document.querySelectorAll('.split').forEach(initSplit)
}

/* resizing: CSS variables only (no re-render), clamps keep the reading column ≥ 440px */
const MIN_MAIN = 440
const saveSizes = () => { store.set('sideW:' + state.dir, state.sideW); store.set('inspW:' + state.dir, state.inspW) }
function initSplit(el) {
  el.onpointerdown = (e) => {
    const which = el.dataset.split
    const x0 = e.clientX, side0 = state.sideW, insp0 = state.inspW
    const wasCollapsed = state.side === 'collapsed', wasClosed = state.insp === 'closed'
    el.setPointerCapture(e.pointerId); el.classList.add('active'); document.documentElement.classList.add('resizing')
    el.onpointermove = (ev) => {
      const dx = ev.clientX - x0, W = app.clientWidth
      if (which === 'side') {
        const raw = (wasCollapsed ? 56 : side0) + dx
        const collapse = raw < 160
        if (collapse !== (state.side === 'collapsed')) { state.side = collapse ? 'collapsed' : 'expanded'; app.dataset.side = state.side }
        if (!collapse) { const insp = state.insp === 'open' ? state.inspW : 0; state.sideW = Math.round(Math.max(220, Math.min(360, raw, W - insp - MIN_MAIN))); applyVars() }
      } else {
        const raw = (wasClosed ? 0 : insp0) - dx
        const close = raw < 200
        if (close !== (state.insp === 'closed')) { state.insp = close ? 'closed' : 'open'; app.dataset.insp = state.insp }
        if (!close) { const side = state.side === 'collapsed' ? 56 : state.sideW; state.inspW = Math.round(Math.max(260, Math.min(480, raw, W - side - MIN_MAIN))); applyVars() }
      }
    }
    el.onpointerup = () => { el.onpointermove = null; el.classList.remove('active'); document.documentElement.classList.remove('resizing'); saveSizes(); render() }
  }
  el.ondblclick = () => { if (el.dataset.split === 'side') state.sideW = SIDE_DEF[state.dir]; else state.inspW = 300; applyVars(); saveSizes() }
}

/* ======================================================================================
   Events
   ====================================================================================== */
document.addEventListener('click', (e) => {
  const t = e.target.closest('button, [data-act]'); if (!t) return
  const d = t.dataset
  if (d.pgDir) { state.dir = d.pgDir; store.set('dir', state.dir); state.theme = store.get('theme:' + state.dir, DIRS[state.dir].theme); loadSizes(); state.menu = null; return render() }
  if (d.pgTheme) { state.theme = d.pgTheme; store.set('theme:' + state.dir, state.theme); return render() }
  if (d.pgSide) { state.side = d.pgSide; return render() }
  if ('pgReset' in d) { state.sideW = SIDE_DEF[state.dir]; state.inspW = 300; state.insp = 'open'; state.side = 'expanded'; saveSizes(); return render() }
  if ('pgNote' in d) { state.note = !state.note; return render() }
  if (d.theme) { state.theme = d.theme; store.set('theme:' + state.dir, state.theme); state.menu = null; return render() }
  if (d.agent) { state.agent = d.agent; state.scope = null; state.filter = ''; state.menu = null; return render() }
  if (d.sel) { if (d.agentOf) state.agent = d.agentOf; state.selected = d.sel; state.palette = false; state.menu = null; return render() }
  if (d.scope != null) { state.scope = d.scope || null; state.menu = null; return render() }
  if (d.tab) { state.tab = d.tab; return render() }
  if (d.change) { state.changeSel = +d.change; return render() }
  if (d.gotoChange) { state.tab = 'changes'; state.changeSel = CHANGES.findIndex((c) => c.path === d.gotoChange); return render() }
  if (d.toggle) { const k = d.toggle; if (d.def === '1') { state.open.has('!' + k) ? state.open.delete('!' + k) : state.open.add('!' + k) } else { state.open.has(k) ? state.open.delete(k) : state.open.add(k) } return render() }
  if (d.jump != null) { const p = document.querySelectorAll('[data-prompt]')[+d.jump]; p?.scrollIntoView({ behavior: 'smooth', block: 'start' }); return }
  switch (d.act) {
    case 'collapse': state.side = state.side === 'collapsed' ? 'expanded' : 'collapsed'; state.menu = null; return render()
    case 'insp': state.insp = state.insp === 'open' ? 'closed' : 'open'; return render()
    case 'agent-menu': state.menu = state.menu === 'agent' ? null : 'agent'; return renderLayer()
    case 'scope-menu': state.menu = state.menu === 'scope' ? null : 'scope'; return renderLayer()
    case 'settings-menu': state.menu = state.menu === 'settings' ? null : 'settings'; return renderLayer()
    case 'more-menu': state.menu = state.menu === 'more' ? null : 'more'; return renderLayer()
    case 'close': state.menu = null; return renderLayer()
    case 'palette': state.palette = true; state.menu = null; state.pq = ''; return renderLayer()
    case 'close-pal': state.palette = false; return renderLayer()
    case 'find': state.find = !state.find; state.tab = 'chat'; return render()
    case 'overview': state.menu = null; return renderLayer()
    case 'mode': t.classList.toggle('write'); t.innerHTML = t.classList.contains('write') ? ic('lock-open', 14) + 'Can edit files' : ic('lock', 14) + 'Read-only'; return
  }
})
document.addEventListener('keydown', (e) => {
  const typing = /INPUT|TEXTAREA/.test(e.target.tagName)
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); state.palette = !state.palette; state.pq = ''; return renderLayer() }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') { e.preventDefault(); state.find = true; state.tab = 'chat'; return render() }
  if ((e.ctrlKey || e.metaKey) && (e.key === '1' || e.key === '2')) { e.preventDefault(); state.tab = e.key === '1' ? 'chat' : 'changes'; return render() }
  if (e.key === 'Escape') { if (state.palette || state.menu) { state.palette = false; state.menu = null; return renderLayer() } if (state.find) { state.find = false; return render() } }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return
  if (e.key === '[') { state.side = state.side === 'collapsed' ? 'expanded' : 'collapsed'; render() }
  else if (e.key === ']') { state.insp = state.insp === 'open' ? 'closed' : 'open'; render() }
  else if (e.key >= '1' && e.key <= '3') { state.agent = AGENTS[+e.key - 1].id; state.scope = null; render() }
  else if (e.key === '/' && state.dir === 'c') { e.preventDefault(); document.getElementById('filter')?.focus() }
  else if (e.key === 'j' || e.key === 'k') { const l = visibleSessions(); const i = l.findIndex((s) => s.id === state.selected); const n = l[Math.max(0, Math.min(l.length - 1, i + (e.key === 'j' ? 1 : -1)))]; if (n) { state.selected = n.id; render(); document.querySelector('.row.on')?.scrollIntoView({ block: 'nearest' }) } }
})
addEventListener('resize', () => { if (state.menu) { state.menu = null; renderLayer() } })
render()
</script>
</body>
</html>
